services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/content_broadcasting
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1d
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
      PUBLIC_BASE_URL: http://localhost:3000
      AUTO_INIT_SCHEMA: "true"
      PUBLIC_RATE_LIMIT_WINDOW_MS: 60000
      PUBLIC_RATE_LIMIT_MAX: 60
      DEFAULT_ROTATION_DURATION_MINUTES: 5
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: content_broadcasting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

